<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 管理 · Web Tools 设计稿</title>
<script>try{const t=localStorage.getItem('zhe-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="shared.css">
<style>
/* ---------- Agent 管理页专属 ---------- */
.agent-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.agent-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px; margin-top: 28px;
}
.agent-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.agent-card-top { display: flex; gap: 12px; align-items: flex-start; }
.agent-card-avatar {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; color: #fff; background: var(--accent);
}
.agent-card.off .agent-card-avatar { background: var(--muted); }
.agent-card-name { flex: 1; min-width: 0; }
.agent-card-name h3 { margin: 0; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.agent-card-name p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-card.off .agent-card-name h3 { color: var(--muted); }

.agent-endpoint {
  display: flex; align-items: center; gap: 8px; padding: 8px 11px;
  border: 1px solid var(--border); border-radius: 9px; background: var(--bg);
  font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 12px; color: var(--muted);
  overflow: hidden;
}
.agent-endpoint svg { flex-shrink: 0; }
.agent-endpoint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-skills { display: flex; flex-wrap: wrap; gap: 6px; }
.agent-skills .od-chip { font-size: 11.5px; padding: 3px 9px; cursor: default; }
.agent-skills .od-chip:hover { transform: none; background: var(--surface); }
.agent-skills-empty { font-size: 12px; color: var(--muted); }
.agent-card-foot {
  display: flex; align-items: center; gap: 6px; margin-top: auto;
  padding-top: 12px; border-top: 1px solid var(--border);
}
.agent-card-foot .spacer { flex: 1; }
.agent-state { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }

/* 开关 */
.switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i {
  position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .18s;
}
.switch i::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .18s;
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 抽屉 */
.drawer-overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 34, .4);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(480px, 100vw);
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lift);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .24s cubic-bezier(.22,.68,.35,1);
}
.drawer.open { transform: none; }
.drawer-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.drawer-head h2 { margin: 0; font-size: 16px; flex: 1; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 16px; align-content: start; }
.drawer-foot {
  display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border);
}
.drawer-foot .od-btn { flex: 1; justify-content: center; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
textarea.od-input { resize: vertical; min-height: 84px; line-height: 1.6; }

/* 温度滑杆 */
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row output { font-size: 13px; font-weight: 600; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
input[type='range'].od-range {
  flex: 1; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 999px;
  background: var(--border); outline-offset: 4px; cursor: pointer;
}
input[type='range'].od-range::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--surface); box-shadow: var(--shadow-card);
}
input[type='range'].od-range::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--surface); box-shadow: var(--shadow-card);
}

/* skills 多选 chips */
.skill-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.skill-pick { position: relative; }
.skill-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.skill-pick span {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  transition: border-color .15s, background .15s;
}
.skill-pick span svg { visibility: hidden; width: 0; transition: width .15s; color: var(--accent-strong); }
.skill-pick:hover span { border-color: var(--accent); }
.skill-pick input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
.skill-pick input:checked + span svg { visibility: visible; width: 13px; }
.skill-pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 测试连接 */
.test-result { display: none; align-items: center; gap: 7px; font-size: 12.5px; margin-top: 7px; }
.test-result.show { display: flex; }
.test-result.ok { color: var(--success); }
.test-result.err { color: var(--danger); }
.spin { animation: od-spin 1s linear infinite; }
@keyframes od-spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .field-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, .drawer-overlay, .switch i, .switch i::after { transition: none; }
  .spin { animation: none; }
}
</style>
</head>
<body>

<nav class="topnav" data-od-id="topnav">
  <div class="topnav-inner">
    <a class="brand" href="home.html">
      <span class="brand-badge">哲</span>
      <span class="brand-name">Web Tools</span>
    </a>
    <div class="nav-links">
      <a class="od-nav-link" href="ai-reports.html">AI资讯</a>
      <a class="od-nav-link" href="stock-reports.html">股票资讯</a>
      <a class="od-nav-link" href="devtools.html">开发工具</a>
      <a class="od-nav-link active" href="agent-chat.html">Agent</a>
    </div>
    <button class="od-icon-btn" data-theme-toggle aria-label="切换主题"></button>
    <a class="od-nav-link" href="login.html">登录</a>
  </div>
</nav>

<main class="container-wide page-main" data-od-id="agent-admin">
  <div class="agent-head">
    <div>
      <p class="eyebrow">Agents</p>
      <h2 class="page-title">Agent 管理</h2>
      <p class="page-desc">创建并配置你的 Agent：请求地址、API Key、模型与挂载的 Skills。</p>
    </div>
    <button class="od-btn od-btn-primary" id="new-agent"><i data-icon="plus" data-size="15"></i>新建 Agent</button>
  </div>

  <div class="agent-grid" id="agent-grid"></div>
</main>

<!-- 编辑抽屉 -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer" data-od-id="agent-drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawer-title">新建 Agent</h2>
    <button class="od-icon-btn" id="drawer-close" aria-label="关闭"><i data-icon="x" data-size="17"></i></button>
  </div>

  <form class="drawer-body" id="agent-form" novalidate>
    <div class="field" data-field="name">
      <label class="od-label" for="f-name">名称</label>
      <input id="f-name" class="od-input" type="text" placeholder="例如：小团子 · 日报助手">
      <p class="field-msg" id="msg-name"></p>
    </div>

    <div class="field" data-field="desc">
      <label class="od-label" for="f-desc">描述 <span style="color:var(--muted);font-weight:400">（可选）</span></label>
      <input id="f-desc" class="od-input" type="text" placeholder="一句话说明这个 Agent 做什么">
      <p class="field-msg" id="msg-desc"></p>
    </div>

    <div class="field" data-field="endpoint">
      <label class="od-label" for="f-endpoint">请求地址</label>
      <input id="f-endpoint" class="od-input" type="url" placeholder="https://api.example.com/v1/chat/completions" spellcheck="false">
      <p class="field-msg" id="msg-endpoint"></p>
    </div>

    <div class="field" data-field="apikey">
      <label class="od-label" for="f-apikey">API Key</label>
      <div class="pwd-wrap">
        <input id="f-apikey" class="od-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button type="button" class="pwd-toggle" id="key-toggle" aria-label="显示 API Key"></button>
      </div>
      <p class="field-msg" id="msg-apikey"></p>
      <p class="hint">仅保存在你自己的账户下，请求时通过 Authorization 头发送。</p>
    </div>

    <div class="field-row">
      <div class="field" data-field="model">
        <label class="od-label" for="f-model">模型</label>
        <select id="f-model" class="od-input">
          <option value="">选择模型...</option>
          <option>claude-fable-5</option>
          <option>claude-opus-4-8</option>
          <option>claude-sonnet-5</option>
          <option>claude-haiku-4-5</option>
          <option>deepseek-v4</option>
          <option>qwen3-max</option>
          <option value="__custom">自定义...</option>
        </select>
        <p class="field-msg" id="msg-model"></p>
      </div>
      <div class="field" data-field="temp">
        <label class="od-label" for="f-temp">温度</label>
        <div class="range-row" style="height:42px">
          <input id="f-temp" class="od-range" type="range" min="0" max="1" step="0.1" value="0.7">
          <output id="temp-out" for="f-temp">0.7</output>
        </div>
        <p class="field-msg" id="msg-temp"></p>
      </div>
    </div>

    <div class="field" data-field="prompt">
      <label class="od-label" for="f-prompt">系统提示词 <span style="color:var(--muted);font-weight:400">（可选）</span></label>
      <textarea id="f-prompt" class="od-input" placeholder="例如：你是「Web Tools」的日报助手，回答简洁、先给结论。"></textarea>
      <p class="field-msg" id="msg-prompt"></p>
    </div>

    <div class="field" data-field="skills">
      <span class="od-label">挂载 Skills</span>
      <div class="skill-picks" id="skill-picks"></div>
      <p class="hint">勾选的 Skill 会以工具形式暴露给模型。</p>
    </div>

    <div class="field">
      <button type="button" class="od-btn od-btn-ghost" id="test-conn">
        <span id="test-icon"></span><span id="test-text">测试连接</span>
      </button>
      <p class="test-result" id="test-result"></p>
    </div>
  </form>

  <div class="drawer-foot">
    <button class="od-btn od-btn-ghost" id="drawer-cancel">取消</button>
    <button class="od-btn od-btn-primary" id="drawer-save">保存 Agent</button>
  </div>
</aside>

<script src="shared.js"></script>
<script>
/* ---------- 种子数据 ---------- */
const SKILL_CATALOG = ['日报阅读', '股票复盘', '网页搜索', '代码执行', '文件读写', 'Markdown 渲染', '翻译', '定时任务'];

let agents = [
  {
    id: 'a1', name: '小团子 · 日报助手', desc: '每天早上读一遍 AI 情报早报，给我三句话总结。',
    endpoint: 'https://api.anthropic.com/v1/messages', apiKey: 'sk-ant-demo-0001',
    model: 'claude-fable-5', temp: 0.4, prompt: '你是「Web Tools」的日报助手，回答简洁、先给结论。',
    skills: ['日报阅读', 'Markdown 渲染'], enabled: true, icon: 'bot',
  },
  {
    id: 'a2', name: '代码评审员', desc: '评审 diff，挑 bug、挑风格、挑过度设计。',
    endpoint: 'https://api.anthropic.com/v1/messages', apiKey: 'sk-ant-demo-0002',
    model: 'claude-opus-4-8', temp: 0.2, prompt: '你是严格的代码评审员，按严重性分级输出问题清单。',
    skills: ['代码执行', '文件读写'], enabled: true, icon: 'code',
  },
  {
    id: 'a3', name: '股票复盘员', desc: '收盘后复盘 A 股 / 港股，关注量能与北向。',
    endpoint: 'https://api.deepseek.com/v1/chat/completions', apiKey: 'sk-ds-demo-0003',
    model: 'deepseek-v4', temp: 0.7, prompt: '',
    skills: ['股票复盘', '网页搜索', '定时任务'], enabled: false, icon: 'trending-up',
  },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---------- 卡片网格 ---------- */
function renderGrid() {
  const grid = $('agent-grid');
  grid.innerHTML = '';
  agents.forEach((a) => {
    const card = document.createElement('article');
    card.className = 'od-card agent-card' + (a.enabled ? '' : ' off');
    card.innerHTML = `
      <div class="agent-card-top">
        <span class="agent-card-avatar">${odSvg(a.icon, 20)}</span>
        <div class="agent-card-name">
          <h3>${esc(a.name)}</h3>
          <p>${esc(a.desc || a.model)}</p>
        </div>
      </div>
      <div class="agent-endpoint">${odSvg('plug', 13)}<span>${esc(a.endpoint)}</span></div>
      <div class="agent-skills">
        ${a.skills.length
          ? a.skills.map((s) => `<span class="od-chip">${odSvg('sparkles', 11)}${esc(s)}</span>`).join('')
          : '<span class="agent-skills-empty">未挂载 Skill</span>'}
      </div>
      <div class="agent-card-foot">
        <label class="agent-state">
          <span class="switch"><input type="checkbox" data-toggle-agent ${a.enabled ? 'checked' : ''}><i></i></span>
          ${a.enabled ? '已启用' : '已停用'}
        </label>
        <span class="spacer"></span>
        <button class="od-icon-btn" data-test title="测试连接" aria-label="测试连接">${odSvg('plug', 15)}</button>
        <button class="od-icon-btn" data-edit title="编辑" aria-label="编辑">${odSvg('pencil', 15)}</button>
        <button class="od-icon-btn" data-del title="删除" aria-label="删除">${odSvg('trash-2', 15)}</button>
      </div>`;

    card.querySelector('[data-toggle-agent]').addEventListener('change', (e) => {
      a.enabled = e.target.checked;
      renderGrid();
    });
    card.querySelector('[data-edit]').addEventListener('click', () => openDrawer(a));
    card.querySelector('[data-del]').addEventListener('click', () => {
      if (confirm(`确定删除「${a.name}」吗？该操作不可恢复。`)) {
        agents = agents.filter((x) => x !== a);
        renderGrid();
      }
    });
    card.querySelector('[data-test]').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      btn.innerHTML = `<span class="spin" style="display:inline-flex">${odSvg('loader', 15)}</span>`;
      setTimeout(() => { btn.innerHTML = odSvg(a.enabled ? 'check' : 'alert-circle', 15); }, 900);
    });
    grid.appendChild(card);
  });
}

/* ---------- 抽屉 ---------- */
const drawer = $('drawer'), overlay = $('drawer-overlay');
let editing = null; /* null = 新建 */

function openDrawer(agent) {
  editing = agent || null;
  $('drawer-title').textContent = agent ? '编辑 Agent' : '新建 Agent';
  $('f-name').value = agent?.name || '';
  $('f-desc').value = agent?.desc || '';
  $('f-endpoint').value = agent?.endpoint || '';
  $('f-apikey').value = agent?.apiKey || '';
  const modelSel = $('f-model');
  modelSel.value = agent?.model || '';
  if (agent && modelSel.value !== agent.model) modelSel.value = '__custom';
  $('f-temp').value = agent?.temp ?? 0.7;
  $('temp-out').textContent = Number($('f-temp').value).toFixed(1);
  $('f-prompt').value = agent?.prompt || '';
  renderSkillPicks(agent?.skills || []);
  clearValidation();
  resetTest();
  drawer.classList.add('open');
  overlay.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  setTimeout(() => $('f-name').focus(), 180);
}

function closeDrawer() {
  drawer.classList.remove('open');
  overlay.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
}

$('new-agent').addEventListener('click', () => openDrawer(null));
$('drawer-close').addEventListener('click', closeDrawer);
$('drawer-cancel').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

/* ---------- skills 多选 ---------- */
function renderSkillPicks(selected) {
  const box = $('skill-picks');
  box.innerHTML = '';
  SKILL_CATALOG.forEach((s) => {
    const label = document.createElement('label');
    label.className = 'skill-pick';
    label.innerHTML = `<input type="checkbox" value="${esc(s)}" ${selected.includes(s) ? 'checked' : ''}>
      <span>${odSvg('check', 13)}${esc(s)}</span>`;
    box.appendChild(label);
  });
}
function pickedSkills() {
  return [...$('skill-picks').querySelectorAll('input:checked')].map((i) => i.value);
}

/* ---------- API Key 可见性（复用 pwd-toggle 模式） ---------- */
const keyInput = $('f-apikey'), keyToggle = $('key-toggle');
function syncKeyIcon() {
  const show = keyInput.type === 'text';
  keyToggle.innerHTML = odSvg(show ? 'eye-off' : 'eye', 17);
  keyToggle.setAttribute('aria-label', show ? '隐藏 API Key' : '显示 API Key');
}
keyToggle.addEventListener('click', () => {
  keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
  syncKeyIcon(); keyInput.focus();
});
syncKeyIcon();

/* ---------- 温度 ---------- */
$('f-temp').addEventListener('input', (e) => { $('temp-out').textContent = Number(e.target.value).toFixed(1); });

/* ---------- 字段级校验 ---------- */
const FIELDS = {
  name:     { el: $('f-name'),     msg: $('msg-name'),     test: (v) => !!v.trim() || '请输入 Agent 名称' },
  endpoint: { el: $('f-endpoint'), msg: $('msg-endpoint'), test: (v) => /^https?:\/\/.+\..+/.test(v.trim()) || '请输入有效的 http(s) 请求地址' },
  apikey:   { el: keyInput,        msg: $('msg-apikey'),   test: (v) => !!v.trim() || '请输入 API Key' },
  model:    { el: $('f-model'),    msg: $('msg-model'),    test: (v) => !!v || '请选择模型' },
};

function setState(key, state, text) {
  const f = FIELDS[key];
  f.el.classList.remove('err', 'ok');
  f.msg.classList.remove('err', 'ok');
  if (state) { f.el.classList.add(state); f.msg.classList.add(state); }
  f.msg.innerHTML = text
    ? `${state === 'err' ? odSvg('alert-circle', 13) : odSvg('check', 13)}<span>${text}</span>` : '';
}
function clearValidation() { Object.keys(FIELDS).forEach((k) => setState(k, '', '')); }

Object.keys(FIELDS).forEach((key) => {
  const f = FIELDS[key];
  f.el.addEventListener('blur', () => { if (f.el.value.trim()) setState(key, f.test(f.el.value) === true ? '' : 'err', f.test(f.el.value) === true ? '' : f.test(f.el.value)); });
  f.el.addEventListener('input', () => { if (f.el.classList.contains('err') && f.test(f.el.value) === true) setState(key, '', ''); });
});

/* ---------- 测试连接 ---------- */
let testing = false;
function resetTest() {
  testing = false;
  $('test-icon').innerHTML = odSvg('plug', 15);
  $('test-text').textContent = '测试连接';
  const r = $('test-result');
  r.className = 'test-result';
  r.innerHTML = '';
}
$('test-conn').addEventListener('click', () => {
  if (testing) return;
  const url = $('f-endpoint').value.trim();
  const r = $('test-result');
  if (!/^https?:\/\/.+\..+/.test(url)) {
    r.className = 'test-result show err';
    r.innerHTML = `${odSvg('alert-circle', 14)}<span>请先填写有效的请求地址</span>`;
    setState('endpoint', 'err', '请输入有效的 http(s) 请求地址');
    $('f-endpoint').focus();
    return;
  }
  testing = true;
  $('test-icon').innerHTML = `<span class="spin" style="display:inline-flex">${odSvg('loader', 15)}</span>`;
  $('test-text').textContent = '连接中...';
  r.className = 'test-result';
  setTimeout(() => {
    testing = false;
    $('test-icon').innerHTML = odSvg('plug', 15);
    $('test-text').textContent = '测试连接';
    const ms = 96 + Math.floor(Math.random() * 160);
    r.className = 'test-result show ok';
    r.innerHTML = `${odSvg('check', 14)}<span>连接成功 · 延迟 ${ms}ms（演示模拟）</span>`;
  }, 1100);
});

/* ---------- 保存 ---------- */
$('drawer-save').addEventListener('click', () => {
  let firstBad = null;
  Object.keys(FIELDS).forEach((key) => {
    const f = FIELDS[key];
    const r = f.test(f.el.value);
    if (r === true) setState(key, '', '');
    else { setState(key, 'err', r); if (!firstBad) firstBad = f.el; }
  });
  if (firstBad) {
    firstBad.focus();
    const box = firstBad.closest('.field');
    box.classList.remove('anim-shake'); void box.offsetWidth; box.classList.add('anim-shake');
    return;
  }

  const data = {
    name: $('f-name').value.trim(),
    desc: $('f-desc').value.trim(),
    endpoint: $('f-endpoint').value.trim(),
    apiKey: keyInput.value.trim(),
    model: $('f-model').value === '__custom' ? 'custom-model' : $('f-model').value,
    temp: Number($('f-temp').value),
    prompt: $('f-prompt').value.trim(),
    skills: pickedSkills(),
  };
  if (editing) {
    Object.assign(editing, data);
  } else {
    agents.unshift({ id: 'a' + Math.random().toString(36).slice(2, 7), enabled: true, icon: 'bot', ...data });
  }
  renderGrid();
  closeDrawer();
});

/* ---------- 初始化 ---------- */
renderGrid();
</script>
