<link rel="stylesheet" href="shared.css">
<style>
/* ---------- Agent 对话页专属 ---------- */
body { overflow: hidden; }
.chat-shell {
  display: grid; grid-template-columns: 272px 1fr;
  height: calc(100vh - 64px);
  border-top: 1px solid var(--border);
}

/* 左栏 · 会话列表 */
.chat-side {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.chat-side-head { padding: 14px 14px 10px; display: grid; gap: 10px; }
.chat-side-head .od-btn { justify-content: center; }
.chat-search { position: relative; }
.chat-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.chat-search .od-input { padding-left: 32px; height: 36px; font-size: 13px; }
.chat-side-body { flex: 1; overflow-y: auto; padding: 4px 10px 14px; }
.chat-group { margin-top: 12px; }
.chat-group-label {
  padding: 0 8px 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.session {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 10px; border: 0; border-radius: 10px; background: transparent;
  color: var(--fg); font: inherit; position: relative;
}
.session:hover { background: var(--accent-soft); }
.session.active { background: var(--accent-soft); }
.session.active::before {
  content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.session-title {
  display: block; font-size: 13.5px; font-weight: 550;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
.session-meta svg { flex-shrink: 0; }
.chat-side-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 13px; }
.chat-side-foot { padding: 10px 14px; border-top: 1px solid var(--border); }
.chat-side-foot a { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; }
.chat-side-foot a:hover { color: var(--accent-strong); }

/* 右栏 · 对话区 */
.chat-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.chat-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.agent-switch { position: relative; }
.agent-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  height: 36px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--fg); font: inherit; font-size: 13.5px; font-weight: 550;
}
.agent-btn:hover { border-color: var(--accent); }
.agent-btn .avatar {
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
  display: grid; place-items: center; color: #fff; background: var(--accent);
}
.agent-btn .chev { color: var(--muted); transition: transform .18s; }
.agent-switch.open .agent-btn .chev { transform: rotate(180deg); }
.agent-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 264px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lift); padding: 6px; display: none;
}
.agent-switch.open .agent-menu { display: block; }
.agent-option {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 9px 10px; border: 0; border-radius: 10px; background: transparent;
  color: var(--fg); font: inherit; cursor: pointer;
}
.agent-option:hover { background: var(--accent-soft); }
.agent-option .avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  display: grid; place-items: center; color: #fff; background: var(--accent);
}
.agent-option .a-name { font-size: 13.5px; font-weight: 550; display: block; }
.agent-option .a-model { font-size: 11.5px; color: var(--muted); display: block; margin-top: 1px; }
.agent-option .tick { margin-left: auto; color: var(--accent-strong); visibility: hidden; }
.agent-option.active .tick { visibility: visible; }
.chat-head-title { min-width: 0; flex: 1; }
.chat-head-title h1 {
  font-size: 14px; font-weight: 600; margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chat-head-title p { font-size: 12px; color: var(--muted); margin: 1px 0 0; }
.chat-head-actions { display: flex; gap: 8px; }

/* 消息流 */
.chat-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.chat-thread { max-width: 760px; margin: 0 auto; padding: 28px 24px 12px; display: grid; gap: 22px; }

.msg { display: flex; gap: 12px; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; margin-top: 2px;
  display: grid; place-items: center;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .msg-avatar { background: var(--accent-soft); color: var(--accent-strong); }
.msg.assistant .msg-avatar { background: var(--accent); color: #fff; }
.msg-body { min-width: 0; max-width: calc(100% - 42px); }
.msg.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
.msg-bubble {
  padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7;
  overflow-wrap: anywhere;
}
.msg.user .msg-bubble {
  background: var(--accent-soft); color: var(--fg);
  border-top-right-radius: 4px; white-space: pre-wrap;
}
.msg.assistant .msg-bubble { padding: 2px 0; }
.msg-text p { margin: 0 0 10px; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text code {
  font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: .9em;
  background: var(--accent-soft); border-radius: 5px; padding: 1px 5px;
}
.msg-code pre code { background: transparent; padding: 0; border-radius: 0; font-size: inherit; }
.msg-code {
  margin: 10px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: var(--surface);
}
.msg-code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; border-bottom: 1px solid var(--border);
  font-size: 11.5px; color: var(--muted);
}
.msg-code-copy {
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11.5px;
  padding: 2px 4px; border-radius: 6px;
}
.msg-code-copy:hover { color: var(--accent-strong); background: var(--accent-soft); }
.msg-code pre {
  margin: 0; padding: 12px 14px; overflow-x: auto;
  font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
  font-size: 12.5px; line-height: 1.65; color: var(--fg);
}
.msg-actions { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
.msg:hover .msg-actions, .msg.streaming .msg-actions { opacity: 1; }
.msg-actions .od-icon-btn { width: 28px; height: 28px; }
.msg.streaming .msg-bubble::after {
  content: ''; display: inline-block; width: 8px; height: 15px; margin-left: 3px;
  vertical-align: -2px; border-radius: 2px; background: var(--accent);
  animation: caret-blink .8s steps(2) infinite;
}
@keyframes caret-blink { 50% { opacity: 0; } }

/* 空态 */
.chat-empty { max-width: 640px; margin: 0 auto; padding: 64px 24px 24px; text-align: center; }
.chat-empty .big-avatar {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
  display: grid; place-items: center; color: #fff; background: var(--accent);
}
.chat-empty h2 { font-size: 20px; margin: 0 0 8px; }
.chat-empty p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
.chat-suggest { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.chat-suggest button {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  padding: 12px 14px; border-radius: 12px; font: inherit; font-size: 13.5px;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg);
}
.chat-suggest button:hover { border-color: var(--accent); box-shadow: var(--shadow-card); }
.chat-suggest svg { color: var(--muted); flex-shrink: 0; }

/* 底部 composer */
.chat-composer { padding: 12px 24px 18px; }
.composer-box {
  max-width: 760px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-card); padding: 10px 12px 8px;
}
.composer-box:focus-within { border-color: var(--accent); }
.composer-box textarea {
  display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent;
  color: var(--fg); font: inherit; font-size: 14px; line-height: 1.6;
  max-height: 180px; padding: 2px 2px 6px;
}
.composer-box textarea::placeholder { color: var(--muted); }
.composer-bar { display: flex; align-items: center; gap: 8px; }
.composer-agent {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  padding: 3px 9px; border-radius: 999px; background: var(--accent-soft);
}
.composer-hint { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.composer-send {
  width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer;
  display: grid; place-items: center; color: #fff; background: var(--accent);
  transition: transform .12s, opacity .12s;
}
.composer-send:hover { background: var(--accent-strong); transform: translateY(-1px); }
.composer-send:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.composer-send.stop { background: var(--danger); }
.composer-note { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }

/* 侧栏开关（窄屏） */
.side-toggle { display: none; }
@media (max-width: 920px) {
  .chat-shell { grid-template-columns: 1fr; }
  .chat-side {
    position: fixed; z-index: 40; top: 64px; bottom: 0; left: 0; width: 272px;
    transform: translateX(-100%); transition: transform .22s; box-shadow: var(--shadow-lift);
  }
  .chat-side.open { transform: none; }
  .side-toggle { display: grid; }
  .chat-suggest { grid-template-columns: 1fr; }
  .composer-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .msg.streaming .msg-bubble::after { animation: none; }
  .chat-side { transition: none; }
}
</style>
</head>

<div class="chat-shell" data-od-id="agent-chat">
  <!-- 左栏 · 历史会话 -->
  <aside class="chat-side" id="chat-side" data-od-id="session-list">
    <div class="chat-side-head">
      <button class="od-btn od-btn-primary" id="new-chat"><i data-icon="plus" data-size="15"></i>新对话</button>
      <div class="chat-search">
        <i data-icon="search" data-size="14"></i>

      </div>

    <div class="chat-side-foot">
      <a href="agent-admin.html"><i data-icon="sliders-horizontal" data-size="14"></i>管理 Agent</a>
    </div>
  </aside>

  <!-- 右栏 · 对话主区 -->
  <section class="chat-main" data-od-id="chat-main">
    <header class="chat-head">
      <button class="od-icon-btn side-toggle" id="side-toggle" aria-label="会话列表"><i data-icon="message-square" data-size="17"></i></button>
      <div class="agent-switch" id="agent-switch">
        <button class="agent-btn" id="agent-btn" aria-haspopup="listbox">
          <span class="avatar" id="agent-avatar"></span>
          <span id="agent-name"></span>
          <span class="chev"><i data-icon="chevron-down" data-size="14"></i></span>
        </button>
        <div class="agent-menu" id="agent-menu" role="listbox"></div>
      </div>
      <div class="chat-head-title">
        <h1 id="chat-title"></h1>
        <p id="chat-sub"></p>
      </div>
      <div class="chat-head-actions">
        <button class="od-icon-btn" id="clear-chat" aria-label="清空当前对话" title="清空当前对话"><i data-icon="trash-2" data-size="16"></i></button>
      </div>
    </header>

    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-thread" id="chat-thread"></div>
    </div>

    <footer class="chat-composer" data-od-id="composer">

        <textarea id="composer-input" rows="1" placeholder="给 Agent 发送消息..."></textarea>
        <div class="composer-bar">
          <span class="composer-agent" id="composer-agent"></span>
          <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
          <button class="composer-send" id="composer-send" aria-label="发送" disabled></button>
        </div>
      </div>
      <p class="composer-note">演示环境：回复为本地模拟流式输出，接入后将发往 Agent 配置的请求地址。</p>
    </footer>
  </section>

<script src="shared.js"></script>
<script>
/* ---------- 种子数据 ---------- */
const AGENTS = [
  { id: 'tuanzi',  name: '小团子 · 日报助手', model: 'claude-fable-5',  icon: 'bot' },
  { id: 'review',  name: '代码评审员',        model: 'claude-opus-4-8', icon: 'code' },
  { id: 'stock',   name: '股票复盘员',        model: 'deepseek-v4',     icon: 'trending-up' },
];

const SESSIONS = [
  {
    id: 's1', agentId: 'review', group: '今天', time: '14:32',
    title: '帮我写个防抖 hook',
    messages: [
      { role: 'user', text: '帮我写一个 Vue 3 的防抖 composable，支持立即执行选项。' },
      { role: 'assistant', segments: [
        { t: 'p', text: '可以，下面这个 useDebounce 支持 leading / trailing 两种触发方式，组件卸载时会自动清理定时器：' },
        { t: 'code', lang: 'ts', text: "import { onUnmounted, ref } from 'vue'\n\nexport function useDebounce<T extends (...args: any[]) => void>(\n  fn: T,\n  delay = 300,\n  immediate = false,\n) {\n  let timer: ReturnType<typeof setTimeout> | null = null\n\n  const debounced = (...args: Parameters<T>) => {\n    const callNow = immediate && !timer\n    if (timer) clearTimeout(timer)\n    timer = setTimeout(() => {\n      timer = null\n      if (!immediate) fn(...args)\n    }, delay)\n    if (callNow) fn(...args)\n  }\n\n  onUnmounted(() => { if (timer) clearTimeout(timer) })\n  return debounced\n}" },
        { t: 'p', text: '使用方式：const onSearch = useDebounce(fetchList, 400)。需要立即触发第一次时传第三个参数 true 即可。' },
      ] },
    ],
  },
  {
    id: 's2', agentId: 'tuanzi', group: '今天', time: '09:15',
    title: 'Claude Code 子代理编排怎么用',
    messages: [
      { role: 'user', text: '今天早报里说的「主代理 + 专项子代理」模式，实际项目里怎么落地？' },
      { role: 'assistant', segments: [
        { t: 'p', text: '核心思路是把一次大任务拆成「探索 → 实现 → 验证」三段，每段交给独立上下文的子代理：' },
        { t: 'p', text: '1. 探索代理只读代码、输出结构化结论，不改动文件；\n2. 实现代理拿到结论后动手改，上下文干净；\n3. 验证代理独立评审 diff，防止「自己改自己夸」。' },
        { t: 'p', text: '在你的个人主页项目里，一次换肤任务就可以这样拆：探索代理先摸清令牌使用情况，实现代理改组件，验证代理跑 pnpm build 核对。' },
      ] },
    ],
  },
  {
    id: 's3', agentId: 'stock', group: '昨天', time: '21:08',
    title: '复盘一下今天的量能变化',
    messages: [
      { role: 'user', text: '今天两市成交额缩到 1.6 万亿，帮我复盘一下量能结构。' },
      { role: 'assistant', segments: [
        { t: 'p', text: '缩量主要发生在午后，早盘一小时成交占比反而升到 38%，说明资金观望情绪集中在尾盘。结构上：北向净流出 42 亿，但两融余额连续第三天回升，杠杆资金在接筹码。' },
        { t: 'p', text: '结论：缩量不破位的概率偏大，重点看明天早盘能否放量收复 5 日线。' },
      ] },
    ],
  },
  {
    id: 's4', agentId: 'tuanzi', group: '过去 7 天', time: '周一',
    title: '把这周 AI 早报整理成周报',
    messages: [
      { role: 'user', text: '把本周一到周五的 AI 情报早报汇总成一份周报，按「模型 / 工具 / 行业」三条线归类。' },
      { role: 'assistant', segments: [
        { t: 'p', text: '好的，已按三条线整理完毕。模型线：Claude Fable 5 开放 API、Gemini 3 Pro 降价 40%；工具线：Cursor 后台 Agent 队列、Claude Code 子代理编排指南；行业线：两家头部厂商宣布 Agent 平台互操作协议。需要我导出成 Markdown 文件吗？' },
      ] },
    ],
  },
];

/* 模拟回复（流式输出内容） */
function fakeReply(agentId, question) {
  const head = {
    tuanzi: '收到，我先理解一下你的问题。',
    review: '好，我从可维护性角度看一下。',
    stock: '嗯，结合盘面数据说两句。',
  }[agentId] || '收到。';
  return [
    { t: 'p', text: `${head}你问的是「${question.slice(0, 40)}」——这是一个演示环境的模拟回复，用来展示流式输出、代码块与消息操作的完整交互。` },
    { t: 'code', lang: 'ts', text: "// 接入真实 Agent 后，这里将是模型返回的内容\nconst res = await fetch(agent.endpoint, {\n  method: \"POST\",\n  headers: { Authorization: `Bearer ${agent.apiKey}` },\n  body: JSON.stringify({ model: agent.model, messages }),\n})" },
    { t: 'p', text: '接入后在「Agent 管理」页配置请求地址、API Key 与模型即可切换到真实服务。' },
  ];
}

/* ---------- 状态 ---------- */
let currentAgent = AGENTS[0];
let currentSession = SESSIONS[0];
let streaming = null; /* { timer, stop() } */

const $ = (id) => document.getElementById(id);
const scrollEl = $('chat-scroll'), threadEl = $('chat-thread'), inputEl = $('composer-input');
const sendBtn = $('composer-send');

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function scrollBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }

/* ---------- 左栏会话列表 ---------- */
function renderSessions(filter = '') {
  const kw = filter.trim().toLowerCase();
  const groups = ['今天', '昨天', '过去 7 天'];
  const list = $('session-list');
  list.innerHTML = '';
  let shown = 0;
  groups.forEach((g) => {
    const items = SESSIONS.filter((s) => s.group === g && (!kw || s.title.toLowerCase().includes(kw)));
    if (!items.length) return;
    shown += items.length;
    const box = document.createElement('div');
    box.className = 'chat-group';
    box.innerHTML = `<div class="chat-group-label">${g}</div>`;
    items.forEach((s) => {
      const agent = AGENTS.find((a) => a.id === s.agentId) || AGENTS[0];
      const btn = document.createElement('button');
      btn.className = 'session' + (s === currentSession ? ' active' : '');
      btn.innerHTML = `<span class="session-title">${esc(s.title)}</span>
        <span class="session-meta">${odSvg(agent.icon, 12)}<span>${esc(agent.name)}</span><span>·</span><span>${s.time}</span></span>`;
      btn.addEventListener('click', () => selectSession(s));
      box.appendChild(btn);
    });
    list.appendChild(box);
  });
  if (!shown) list.innerHTML = '<div class="chat-side-empty">没有匹配的对话</div>';
}

/* ---------- 消息渲染 ---------- */
function segmentHtml(seg) {
  if (seg.t === 'code') {
    return `<div class="msg-code">
      <div class="msg-code-head"><span>${esc(seg.lang || 'text')}</span>
        <button class="msg-code-copy" data-copy>${odSvg('copy', 12)}复制代码</button></div>
      <pre><code>${esc(seg.text)}</code></pre></div>`;
  }
  return `<p>${esc(seg.text).replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>')}</p>`;
}

function msgEl(m) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${m.role}`;
  const icon = m.role === 'user' ? odSvg('user', 15) : odSvg(currentAgent.icon, 15);
  const body = m.role === 'user'
    ? `<div class="msg-bubble">${esc(m.text)}</div>`
    : `<div class="msg-bubble msg-text">${(m.segments || []).map(segmentHtml).join('')}</div>
       <div class="msg-actions">
         <button class="od-icon-btn" data-act="copy" title="复制" aria-label="复制">${odSvg('copy', 14)}</button>
         <button class="od-icon-btn" data-act="regen" title="重新生成" aria-label="重新生成">${odSvg('refresh-cw', 14)}</button>
       </div>`;
  wrap.innerHTML = `<span class="msg-avatar">${icon}</span><div class="msg-body">${body}</div>`;
  return wrap;
}

function renderThread() {
  stopStreaming();
  threadEl.innerHTML = '';
  const msgs = currentSession.messages;
  if (!msgs.length) { renderEmpty(); return; }
  msgs.forEach((m) => threadEl.appendChild(msgEl(m)));
  $('chat-title').textContent = currentSession.title;
  $('chat-sub').textContent = `${currentAgent.name} · ${currentAgent.model} · ${msgs.length} 条消息`;
  scrollBottom();
}

function renderEmpty() {
  $('chat-title').textContent = '新对话';
  $('chat-sub').textContent = `${currentAgent.name} · ${currentAgent.model}`;
  threadEl.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'chat-empty';
  box.innerHTML = `
    <span class="big-avatar">${odSvg(currentAgent.icon, 26)}</span>
    <h2>开始和「${esc(currentAgent.name)}」对话</h2>
    <p>当前模型 ${esc(currentAgent.model)} · 可以问它任何事，或从下面开始：</p>
    <div class="chat-suggest">
      <button data-q="总结一下今天的 AI 情报早报要点">${odSvg('newspaper', 16)}总结今天的 AI 早报要点</button>
      <button data-q="帮我把这个函数重构成更函数式的写法">${odSvg('code', 16)}帮我重构一段代码</button>
      <button data-q="复盘一下今天 A 股的量能结构">${odSvg('trending-up', 16)}复盘今天的量能结构</button>
      <button data-q="给我讲讲 Claude Code 的子代理编排">${odSvg('sparkles', 16)}讲讲子代理编排</button>
    </div>`;
  box.querySelectorAll('[data-q]').forEach((b) =>
    b.addEventListener('click', () => { inputEl.value = b.dataset.q; autosize(); sendMessage(); }));
  threadEl.appendChild(box);
}

/* ---------- 流式输出模拟 ---------- */
function stopStreaming(finish = false) {
  if (!streaming) return;
  clearInterval(streaming.timer);
  const el = streaming.el;
  streaming = null;
  el.classList.remove('streaming');
  syncSendBtn();
}

function syncSendBtn() {
  if (streaming) {
    sendBtn.disabled = false;
    sendBtn.classList.add('stop');
    sendBtn.innerHTML = odSvg('square', 14);
    sendBtn.setAttribute('aria-label', '停止生成');
  } else {
    sendBtn.classList.remove('stop');
    sendBtn.innerHTML = odSvg('send', 15);
    sendBtn.setAttribute('aria-label', '发送');
    sendBtn.disabled = !inputEl.value.trim();
  }
}

function streamReply(segments) {
  const m = { role: 'assistant', segments: [] };
  const el = msgEl(m);
  el.classList.add('streaming');
  threadEl.appendChild(el);
  scrollBottom();

  /* 把分段摊平成字符队列，逐段输出 */
  let segIdx = 0, charIdx = 0;
  const timer = setInterval(() => {
    if (segIdx >= segments.length) { stopStreaming(true); return; }
    const seg = segments[segIdx];
    charIdx += 3;
    if (charIdx >= seg.text.length) {
      m.segments = m.segments.slice(0, segIdx).concat(seg);
      segIdx++; charIdx = 0;
    } else {
      const partial = { ...seg, text: seg.text.slice(0, charIdx) };
      m.segments = m.segments.slice(0, segIdx).concat(partial);
    }
    el.querySelector('.msg-bubble').innerHTML = m.segments.map(segmentHtml).join('');
    scrollBottom();
  }, 24);

  streaming = { timer, el, message: m };
  syncSendBtn();
}

/* ---------- 发送 ---------- */
function sendMessage() {
  if (streaming) return;
  const text = inputEl.value.trim();
  if (!text) return;

  if (!currentSession.messages.length) {
    /* 首条消息：用问题前 16 字作为会话标题 */
    currentSession.title = text.length > 16 ? text.slice(0, 16) + '…' : text;
    currentSession.group = '今天';
    currentSession.time = '刚刚';
    threadEl.innerHTML = '';
    renderSessions($('session-search').value);
  }
  currentSession.messages.push({ role: 'user', text });
  threadEl.appendChild(msgEl(currentSession.messages[currentSession.messages.length - 1]));
  $('chat-title').textContent = currentSession.title;
  inputEl.value = '';
  autosize();
  scrollBottom();

  const segments = fakeReply(currentSession.agentId, text);
  setTimeout(() => streamReply(segments), 420);
  syncSendBtn();
}

/* ---------- 会话切换 / 新建 / 清空 ---------- */
function selectSession(s) {
  currentSession = s;
  setAgent(AGENTS.find((a) => a.id === s.agentId) || AGENTS[0]);
  renderSessions($('session-search').value);
  renderThread();
  $('chat-side').classList.remove('open');
}

$('new-chat').addEventListener('click', () => {
  const s = { id: 's' + Math.random().toString(36).slice(2, 7), agentId: currentAgent.id, group: '今天', time: '刚刚', title: '新对话', messages: [] };
  SESSIONS.unshift(s);
  selectSession(s);
  inputEl.focus();
});

$('clear-chat').addEventListener('click', () => {
  currentSession.messages = [];
  renderSessions($('session-search').value);
  renderThread();
});

$('session-search').addEventListener('input', (e) => renderSessions(e.target.value));
$('side-toggle').addEventListener('click', () => $('chat-side').classList.toggle('open'));

/* ---------- Agent 切换 ---------- */
const switchEl = $('agent-switch');
function setAgent(a) {
  currentAgent = a;
  currentSession.agentId = a.id;
  $('agent-avatar').innerHTML = odSvg(a.icon, 13);
  $('agent-name').textContent = a.name;
  $('composer-agent').innerHTML = `${odSvg(a.icon, 12)}${esc(a.name)} · ${esc(a.model)}`;
  renderAgentMenu();
  renderSessions($('session-search').value);
}

function renderAgentMenu() {
  const menu = $('agent-menu');
  menu.innerHTML = '';
  AGENTS.forEach((a) => {
    const b = document.createElement('button');
    b.className = 'agent-option' + (a === currentAgent ? ' active' : '');
    b.setAttribute('role', 'option');
    b.innerHTML = `<span class="avatar">${odSvg(a.icon, 15)}</span>
      <span><span class="a-name">${esc(a.name)}</span><span class="a-model">${esc(a.model)}</span></span>
      <span class="tick">${odSvg('check', 15)}</span>`;
    b.addEventListener('click', () => { setAgent(a); switchEl.classList.remove('open'); renderThread(); });
    menu.appendChild(b);
  });
}

$('agent-btn').addEventListener('click', (e) => { e.stopPropagation(); switchEl.classList.toggle('open'); });
document.addEventListener('click', (e) => { if (!switchEl.contains(e.target)) switchEl.classList.remove('open'); });

/* ---------- 消息操作（复制 / 重新生成 / 复制代码） ---------- */
threadEl.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const code = copyBtn.closest('.msg-code').querySelector('code').textContent;
    odCopy(code, null);
    copyBtn.innerHTML = `${odSvg('check', 12)}已复制`;
    setTimeout(() => { copyBtn.innerHTML = `${odSvg('copy', 12)}复制代码`; }, 1500);
    return;
  }
  const actBtn = e.target.closest('[data-act]');
  if (!actBtn || streaming) return;
  const msgWrap = actBtn.closest('.msg');
  const idx = [...threadEl.querySelectorAll('.msg')].indexOf(msgWrap);
  const m = currentSession.messages[idx];
  if (!m) return;
  if (actBtn.dataset.act === 'copy') {
    odCopy(m.segments.map((s) => s.text).join('\n\n'), null);
    actBtn.innerHTML = odSvg('check', 14);
    setTimeout(() => { actBtn.innerHTML = odSvg('copy', 14); }, 1500);
  } else if (actBtn.dataset.act === 'regen') {
    /* 移除该条及其后所有消息，重新生成 */
    currentSession.messages = currentSession.messages.slice(0, idx);
    const lastUser = [...currentSession.messages].reverse().find((x) => x.role === 'user');
    renderThread();
    streamReply(fakeReply(currentSession.agentId, lastUser ? lastUser.text : ''));
  }
});

/* ---------- composer ---------- */
function autosize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
}
inputEl.addEventListener('input', () => { autosize(); syncSendBtn(); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', () => {
  if (streaming) { stopStreaming(); return; }
  sendMessage();
});

/* ---------- 初始化 ---------- */
setAgent(currentAgent);
renderThread();
syncSendBtn();
autosize();
</script>
</body>
</html>
