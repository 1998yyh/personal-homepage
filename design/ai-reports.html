<script src="shared.js"></script>
<script>
const REPORTS = [
  {
    id: 1, date: '2026-07-23', week: '周三', title: 'Claude Code 最佳实践：从提示词到 Agent 工程化',
    body: `
      <h2>今日要闻</h2>
      <ul>
        <li><strong>Anthropic 发布 Claude Code 子代理编排指南</strong>官方文档新增「主代理 + 专项子代理」模式：探索、实现、验证分离，长任务上下文污染显著下降。社区反馈多代理工作流在迁移类任务上提速约 40%。</li>
        <li><strong>Claude Fable 5 开放 API</strong>Mythos 家族首个模型上线，长上下文与工具调用稳定性是主打卖点，定价与 Opus 4.8 持平。</li>
        <li><strong>Cursor 推出后台 Agent 队列</strong>支持最多 8 个并行后台任务，与 Claude Code 的 headless 模式正面竞争。</li>
      </ul>
      <h2>工程实践</h2>
      <p>本周值得读的一篇：<a href="#">《CLAUDE.md 工程化：把项目记忆当代码审查》</a>。核心观点——CLAUDE.md 应该像代码一样走 PR 评审，过期指令比没有指令更危险。</p>
      <blockquote>「把重复的事交给工具，把思考留给自己。」—— 与 Agent 协作的第一原则</blockquote>
      <h2>工具更新</h2>
      <p><code>claude-code@2.1</code> 新增 <code>/verify</code> 技能钩子，可在提交前自动跑端到端验证；Vite 8 的 Rolldown 模式在大型 monorepo 上冷启动进入亚秒级。</p>`
  },
  {
    id: 2, date: '2026-07-22', week: '周二', title: 'OpenAI 发布新一代推理模型，Agent 基准再洗牌',
    body: `
      <h2>今日要闻</h2>
      <ul>
        <li><strong>OpenAI 发布 o 系列新模型</strong>在 SWE-bench Verified 上取得新高，长链路推理任务的自我纠错能力是主要亮点；API 价格下调 30%。</li>
        <li><strong>Google 更新 Gemini Agent 模式</strong>浏览器内自主操作全面开放，支持跨标签页任务编排。</li>
        <li><strong>Meta 开源 Llama 4 工具调用套件</strong>包含函数调用训练数据与评估脚本，补齐开源生态短板。</li>
      </ul>
      <h2>观点</h2>
      <p>推理模型的竞争重心正从「单次回答质量」转向「长任务完成率」。对应用开发者来说，<strong>可恢复的 agentic loop</strong> 比更高的单步准确率更有价值。</p>
      <blockquote>基准分数每季度洗牌一次，工程范式每年才变一次——押注后者。</blockquote>`
  },
  {
    id: 3, date: '2026-07-21', week: '周一', title: 'Agent 框架横评：从流程编排到自主执行',
    body: `
      <h2>本期主题</h2>
      <p>横向对比了五款主流 Agent 框架在同一个「代码库迁移」任务上的表现，维度包括：上下文管理、工具抽象、可观测性与断点恢复。</p>
      <h2>结论速览</h2>
      <ul>
        <li><strong>编排派（LangGraph 等）</strong>适合流程确定的企业场景，图结构即文档，但长尾分支维护成本高。</li>
        <li><strong>自主派（Claude Code 等）</strong>模型自主规划路线，泛化最好；关键在权限边界与验证回路的工程设计。</li>
        <li><strong>混合派</strong>主干流程编排 + 节点内自主执行，正在成为生产环境的主流选择。</li>
      </ul>
      <h2>一句话建议</h2>
      <p>先写清楚 <code>CLAUDE.md</code> 式的项目上下文，再谈框架选型——上下文工程是所有框架的共同地基。</p>`
  },
  {
    id: 4, date: '2026-07-20', week: '周日', title: '一周 AI 论文精选：记忆、检索与自我验证',
    body: `
      <h2>论文精选</h2>
      <ul>
        <li><strong>Agentic Memory</strong>提出让 Agent 自主决定「记什么、忘什么」的记忆管理层，长程任务成功率提升 18%。</li>
        <li><strong>Self-Verify Decoding</strong>在解码阶段插入轻量验证 token，数学推理错误率下降近半，推理开销仅增 6%。</li>
        <li><strong>Retrieval as Tool</strong>把 RAG 统一进工具调用协议，检索查询由模型按需发起，告别固定 top-k 管线。</li>
      </ul>
      <blockquote>周日刊为轻量版：只列论文与一句话点评，深入解读见周一专题。</blockquote>`
  },
];

const listEl = document.getElementById('report-list');
const contentEl = document.getElementById('report-content');

function fmtDate(d) {
  const dt = new Date(d);
  return { label: `${dt.getMonth() + 1}月${dt.getDate()}日`, full: `${dt.getFullYear()} 年 ${dt.getMonth() + 1} 月 ${dt.getDate()} 日` };
}

function renderList(activeId) {
  listEl.innerHTML = REPORTS.map((r) => `
    <button class="od-item report-item ${r.id === activeId ? 'active' : ''}" data-id="${r.id}">
      <span class="d-row"><span class="d-date">${fmtDate(r.date).label}</span><span class="d-week">${r.week}</span></span>
      <p class="d-title">${r.title}</p>
    </button>`).join('');
  listEl.querySelectorAll('.report-item').forEach((btn) => {
    btn.addEventListener('click', () => select(+btn.dataset.id));
  });
}

function select(id) {
  const r = REPORTS.find((x) => x.id === id);
  renderList(id);
  contentEl.innerHTML = `
    <div class="doc-head"><h1>${r.title}</h1><p>${fmtDate(r.date).full}</p></div>
    ${r.body}`;
  contentEl.scrollTop = 0;
}

select(REPORTS[0].id);
</script>
</body>
