<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="团子 AI：对话、图像与视频创作、无限画布和每日 AI 资讯" />
    <title>团子 AI</title>
    <script>
      // 首屏即应用外观：迁移已选原型配色，再恢复正式设置；新访客默认深色苔绿。
      ;(function () {
        var t = 'dark'
        try {
          var prototypeTheme = localStorage.getItem('tuanzi-ui-appearance')
          var saved = localStorage.getItem('zhe-theme')
          if (prototypeTheme === 'D' || prototypeTheme === 'F') {
            t = prototypeTheme === 'F' ? 'light' : 'dark'
            localStorage.setItem('zhe-theme', t)
            localStorage.removeItem('tuanzi-ui-appearance')
          } else if (saved === 'dark' || saved === 'light') t = saved
        } catch (e) { /* 存储不可用时仍可使用默认主题 */ }
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
